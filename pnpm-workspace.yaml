packages:
  - packages/core/*
  - packages/cordis/*
  - packages/extensions/*
  - packages/loaders/*
# 统一 schemastery 单实例：@deepseek-ai/dsh-* 的 0.1.x 依赖声明 ^3.18.1，
# 而本仓各包钉 3.18.1-rc.1——双实例会让 mygo 的 schema 推断类型无法命名
# （tsc TS2883）。override 强制单版本，与仓内既有钉一致。
overrides:
  '@deepseek-ai/schemastery': '3.18.1-rc.1'
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-include@1.0.6'
  - '@deepseek-ai/cordis-plugin-loader@1.0.2'
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-home-paths@0.1.0-rc.2'
  - '@deepseek-ai/dsh-type-meta@0.0.1-rc.1'
  - '@deepseek-ai/cordis-plugin-group@1.0.1'
  - '@deepseek-ai/dsh-app-boot@0.1.0-rc.2'
  - '@deepseek-ai/dsh-launch-environment@0.1.0-rc.2'
  # 已更名/退役的内部包（registry 404 属预期），lockfile 存量条目豁免
  # minimumReleaseAge 校验（2026-08-14 本机供应链策略拦截实录）。
  - '@deepseek-ai/dsh-compact@0.0.1-rc.1'
  - '@deepseek-ai/dsh-paths@0.0.1-rc.1'
  - '@deepseek-ai/dsh-user-interaction@0.0.1-rc.1'
